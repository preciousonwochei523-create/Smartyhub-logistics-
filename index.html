body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}

.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:14px 0}.seg button{flex:1;min-width:0;white-space:nowrap;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);display:flex;gap:6px;justify-content:center;align-items:center}.seg .a{background:var(--card);color:var(--pri);box-shadow:0 1px 6px rgba(20,8,43,.12)}

.bd{position:absolute;top:3px;left:55%;background:var(--warn);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;z-index:20}
.login{padding:24px 18px 36px;min-height:100vh;background:radial-gradient(120% 38% at 50% 0,rgba(123,13,253,.3),transparent 70%)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.brand img{height:46px}.brand b{display:block;font-size:17px}h1{font-size:28px;margin-bottom:4px}.lead{margin-bottom:8px}label.sub{display:block;margin-top:8px}.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:6px;top:12px;padding:8px;color:var(--mut)}.btn.grad{background:linear-gradient(135deg,var(--pri),var(--mid))}.or{display:flex;align-items:center;gap:12px;color:var(--mut);margin:16px 0}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--br)}.btn.g{background:#fff;color:#1f1f1f;display:flex;gap:10px;justify-content:center;align-items:center;border:1px solid var(--br)}.demo{margin-top:26px}.demo h3{display:flex;gap:8px;align-items:center}.demo svg{color:var(--pri)}.dr{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-top:10px}.use{background:var(--pri);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;display:flex;gap:6px;align-items:center}.empty{text-align:center;color:var(--mut);padding:30px 8px}
.cred{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}pre{background:#150a2b;color:#d9c5ff;padding:12px;border-radius:12px;font-size:12px;overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.o{animation:in .25s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}

function ic(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;flex:none">'+P[n]+'</svg>'}
var BANKS=[["044","Access Bank"],["058","GTBank"],["057","Zenith Bank"],["033","UBA"],["011","First Bank"],["999992","Opay"],["999991","PalmPay"],["50211","Kuda"],["50515","Moniepoint"],["035","Wema Bank"],["070","Fidelity Bank"],["232","Sterling Bank"],["032","Union Bank"],["221","Stanbic IBTC"],["214","FCMB"],["050","Ecobank"],["076","Polaris Bank"],["082","Keystone Bank"]];

function readBank(){var c=$("bk"),n=$("ba"),a=$("bn");if(!c||!/^\d{10}$/.test(n)||!a){toast("Choose your bank and enter a 10-digit account number and account name");return null}return{code:c,bank:BANKS.find(function(x){return x[0]===c})[1],no:n,name:a}}
var CAT={food:{n:"Food & Supplements",src:"SmartyHub Organic"},med:{n:"Pharmacy",src:"HosiRx"},re:{n:"Real Estate",src:"MainTown Realty"}};
var CMAP={food_supplement:"food",pharmacy:"med",document_parcel:"re"},CREV={food:"food_supplement",med:"pharmacy",re:"document_parcel"},SMAP={open:"open",claimed:"open",assigned:"assigned",picked_up:"picked",delivered:"delivered",cancelled:"cancelled"};
var CFG=window.SHL||{},sb=window.supabase&&CFG.key&&CFG.key.indexOf("PASTE")<0?supabase.createClient(CFG.url,CFG.key,{auth:{storageKey:"shl-app-auth"}}):null,ZONES=[];
var S={role:null,me:null,tab:"",lr:"rider",mode:"in",toast:"",skip:[],cred:null,ready:false,fleets:[],riders:[],orders:[],zones:[]};
function mapD(d){return{id:d.id,ref:d.ref,cat:CMAP[d.category],zone:d.zone||"",from:(d.pickup_name?d.pickup_name+", ":"")+d.pickup_address,to:d.drop_address,fee:+d.fee||0,note:[d.note,d.cod_amount>0?"Collect "+N(d.cod_amount)+" cash":""].filter(Boolean).join(". "),pin:d.requires_code?"1":"",st:SMAP[d.status],fleet:d.fleet_id,rider:d.rider_id,dn:d.drop_name,dp:d.drop_phone,pp:d.pickup_phone}}
function mail(p){return"234"+String(p).replace(/\D/g,"").slice(-10)+"@riders.smartyhub.app"}
async function boot(){
 var ses=(await sb.auth.getSession()).data.session;
 if(!ses){S.role=null;S.ready=true;return R()}
 var p=(await sb.from("profiles").select("*").eq("user_id",ses.user.id).maybeSingle()).data;
 if(!p||p.role==="admin"){await sb.auth.signOut();S.role=null;S.ready=true;R();return toast(p?"Admins sign in at admin.html":"This account has no access yet")}
 S.role=p.role==="rider"?"rider":"fleet";
 var f=(await sb.from("fleets").select("*").eq("id",p.fleet_id)).data||[];
 S.fleets=f.map(function(x){return{id:x.id,name:x.name,comm:+x.commission_pct,cats:(x.categories||[]).map(function(c){return CMAP[c]})}});
 if(!S.tab)S.tab=S.role==="rider"?"home":"orders";
 await refresh(true);S.ready=true;R();listen()}
async function refresh(first){
 var s=(await sb.auth.getSession()).data.session;if(!s)return;
 var old=S.orders.filter(function(o){return o.st==="open"&&!o.rider}).map(function(o){return o.id});
 var q=await Promise.all([sb.from("deliveries").select("*").order("created_at",{ascending:false}).limit(200),sb.from("riders").select("*"),sb.from("zones").select("name").order("name")]);
 if(q[0].error)return;
 S.orders=(q[0].data||[]).map(mapD);S.zones=(q[2].data||[]).map(function(z){return z.name});ZONES=S.zones;
 S.riders=(q[1].data||[]).map(function(r){return{id:r.id,uid:r.user_id,name:r.name,phone:r.phone,fleet:r.fleet_id,on:r.online,zones:r.zones||[],cats:(r.categories||[]).map(function(c){return CMAP[c]})}});
 if(S.role==="rider"){var me=S.riders.find(function(r){return r.uid===s.user.id});S.me=me&&me.id;var b=(await sb.rpc("rider_my_bank")).data;if(me&&b&&b[0])me.bank={code:b[0].bank_code,bank:b[0].bank_name,no:b[0].account_number,name:b[0].account_name}}
 else S.me=S.fleets[0]&&S.fleets[0].id;
 if(first)return;
 var fresh=S.orders.filter(function(o){return o.st==="open"&&!o.rider&&old.indexOf(o.id)<0}).length;
 var ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
 if(fresh&&S.role==="rider"&&rd(S.me)&&rd(S.me).on){if(navigator.vibrate)navigator.vibrate([200,100,200]);toast("New order request")}else R()}
var ch=null;
function listen(){if(ch)return;ch=sb.channel("d").on("postgres_changes",{event:"*",schema:"public",table:"deliveries"},function(){clearTimeout(window._t);window._t=setTimeout(function(){refresh()},400)}).subscribe();setInterval(function(){if(S.role)refresh()},20000)}
function N(n){return "₦"+Math.round(n).toLocaleString("en-NG")}
function fl(i){return S.fleets.find(function(f){return f.id===i})}function rd(i){return S.riders.find(function(r){return r.id===i})}function od(i){return S.orders.find(function(o){return o.id===i})}
function $(i){return document.getElementById(i).value.trim()}
function toast(m){S.toast=m;R();setTimeout(function(){S.toast="";R()},1900)}
function tog(a,v){var i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);R()}function go(t){S.tab=t;R()}
function mp(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a+", Lagos, Nigeria")}

function E(e){if(e&&e.error){toast(String(e.error.message||"Something went wrong"));return true}return false}

async function login(){
 if(!sb)return toast("App not configured yet. Add your key in config.js");
 var pin=$("pin");
 if(S.lr==="fleet"){var em=$("em");if(!em||!pin)return toast("Enter your email and password");var x=await sb.auth.signInWithPassword({email:em,password:pin});if(x.error)return toast("Wrong email or password");return boot()}
 var p=$("p");
 if(S.mode==="in"){if(!p||!pin)return toast("Enter your phone number and PIN");var y=await sb.auth.signInWithPassword({email:mail(p),password:pin});if(y.error)return toast("Wrong phone number or PIN");return boot()}
 var n=$("n");if(!n||p.replace(/\D/g,"").length<10||!/^\d{6}$/.test(pin))return toast("Fill every field. PIN is 6 digits");var bk=readBank();if(!bk)return;
 var z=await sb.functions.invoke("create-rider",{body:{self:true,name:n,phone:p,pin:pin,bank:bk}});
 if(z.error)return toast(await fnErr(z,"Could not register"));

 rpc("advance_delivery",{p_id:id,p_code:c},function(){toast("Delivered. Your payment is on its way")})}

if(m!=="active")h+='<div class="sub">'+o.note+(o.pin?" Delivery code required.":"")+'</div>';
if(m==="accept")h+='<div class="two"><button class="btn s" onclick="skip(\''+o.id+'\')">Skip</button><button class="btn" onclick="accept(\''+o.id+'\')">Accept '+N(o.fee)+'</button></div>';

var ph=o.st==="assigned"?o.pp:o.dp;if(ph)h+='<a class="btn s" href="tel:'+ph+'">Call '+(o.st==="assigned"?"pickup":(o.dn||"customer"))+'</a>';
