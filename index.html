<!DOCTYPE html>
<html lang="en">

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09001c;--card:#170a30;--tx:#f0eafc;--mut:#a597c9;--br:#2d1a52;--pri:#9a47ff;--food:#f0a050;--med:#ff7aa8;--re:#7ea8ff;--ok:#3dd68c}}
:root[data-theme="dark"]{--bg:#09001c;--card:#170a30;--tx:#f0eafc;--mut:#a597c9;--br:#2d1a52;--pri:#9a47ff;--food:#f0a050;--med:#ff7aa8;--re:#7ea8ff;--ok:#3dd68c}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
body.w{max-width:960px}
button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;color:#29015a;border-bottom:3px solid var(--pri);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.brand{display:flex;align-items:center;gap:10px}.brand .hx{height:42px}.brand .wm{height:30px;max-width:46vw;object-fit:contain}
.brand b{display:block;font-size:16px;letter-spacing:.5px}.brand b span{color:#b98bff}.brand small{font-size:10px;letter-spacing:4px;opacity:.8}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--br);padding:6px 12px;border-radius:99px;font-weight:600;font-size:12px;color:var(--tx)}header .pill{color:#29015a;border-color:#d9c9f5}
.dot{width:9px;height:9px;border-radius:50%;background:#8a7fa8}.on .dot{background:#3dd68c}
.wrap{padding:16px}h2{font-size:17px;margin:2px 0 12px}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.t-food{background:var(--food)}.t-med{background:var(--med)}.t-re{background:var(--re)}
.fee{font-weight:800;font-size:17px;color:var(--pri)}
.route{margin:10px 0;padding-left:14px;border-left:2px dashed var(--pri)}.route div{margin:4px 0}.route small{color:var(--mut);display:block}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.btn{background:linear-gradient(135deg,var(--pri),var(--mid));color:#fff;padding:12px;border-radius:10px;font-weight:700;width:100%;text-align:center;display:block;text-decoration:none;margin-top:6px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--br)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--br);background:var(--card);font-size:13px}.chip.a{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:inherit;display:flex;background:var(--card);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
body nav{max-width:520px}body.w nav{max-width:960px}
nav button{flex:1;padding:10px 2px;font-size:12px;color:var(--mut);position:relative}nav button.a{color:var(--pri);font-weight:700}nav i{display:flex;justify-content:center;margin-bottom:2px}.seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.badge{position:absolute;top:4px;left:56%;background:var(--med);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);margin:6px 0 10px}
.big{font-size:30px;font-weight:800}.steps{display:flex;gap:6px;margin:10px 0}.steps span{flex:1;height:5px;border-radius:9px;background:var(--br)}.steps span.d{background:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:36px 10px;grid-column:1/-1}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:20}
.seg{display:flex;background:var(--card);border:1px solid var(--br);border-radius:12px;padding:4px;margin:18px 0}.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.a{background:var(--pri);color:#fff}
.hero{text-align:center;background:#fff;margin:0 -16px;padding:24px 0 14px;border-bottom:3px solid var(--pri)}.hero img{width:min(280px,72%)}
pre{background:var(--ink);color:#d9c5ff;padding:12px;border-radius:10px;font-size:12px;overflow-x:auto}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kpi .big{font-size:22px}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--br)}
</style>
</head>

function ic(n,s){s=s||18;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none">'+IC[n]+'</svg>'}

var S={role:null,me:null,tab:"",lr:"rider",toast:"",
fleets:[{id:"own",name:"SmartyHub Fleet",comm:0,cats:["food","med","re"],key:"shl_live_own_8f2a91"},{id:"swift",name:"SwiftMove Logistics",comm:15,cats:["food","re"],key:"shl_live_swf_c47d02"},{id:"kobo",name:"KoboRide Dispatch",comm:12,cats:["food","med"],key:"shl_live_kbr_19be77"}],

function rd(id){return S.riders.find(function(r){return r.id===id})}
function od(id){return S.orders.find(function(o){return o.id===id})}
function toast(m){S.toast=m;R();setTimeout(function(){S.toast="";R()},1900)}
function tog(a,v){var i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);R()}
function go(t){S.tab=t;R()}
function map(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a+", Lagos, Nigeria")}
function login(){var r=S.lr;
if(r==="admin"){S.role="admin";S.tab="orders"}

else{var n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim(),f=document.getElementById("fs").value;if(!n||!p)return toast("Enter your name and phone");var x=S.riders.find(function(q){return q.phone===p});if(!x){x={id:"r"+(S.riders.length+1),name:n,phone:p,fleet:f,on:true,zones:["Lekki Phase 1","Ikeja","Victoria Island"],cats:["food","med","re"]};S.riders.push(x)}S.role="rider";S.me=x.id;S.tab="feed"}
R()}
function out(){S.role=null;S.me=null;R()}
