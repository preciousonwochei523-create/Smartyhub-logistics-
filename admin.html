<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#150a2b">
<meta name="robots" content="noindex"><link rel="icon" href="assets/icon-192.png"><title>SmartyHub Admin</title>
<style>
:root{--bg:#f4f2f8;--card:#fff;--tx:#150a2b;--mut:#7a7194;--br:#e6e0f2;--pri:#7b0dfd;--ok:#12a05c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0618;--card:#171029;--tx:#f1ecfc;--mut:#a79bc8;--br:#2b1f4a;--pri:#9a47ff}}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:84px}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
header{background:#150a2b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}header button{color:#d9c5ff;font-size:13px}
.w{padding:16px}h2{font-size:20px;margin:4px 0 12px}h3{font-size:15px;margin:16px 0 8px}.sub{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--card);border:1.5px solid var(--br);border-radius:18px;padding:14px}
.fee{font-size:22px;font-weight:800}.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg)}
.btn{display:block;width:100%;background:var(--pri);color:#fff;padding:13px;border-radius:14px;font-weight:700;margin-top:8px}.btn.s{background:var(--bg);color:var(--tx)}.pill{background:var(--pri);color:#fff;padding:9px 14px;border-radius:99px;font-weight:700}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--br);background:var(--bg);margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{padding:7px 12px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:600}.chip.a{background:var(--pri);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--br)}th{color:var(--mut);font-weight:600}.bar{height:8px;border-radius:9px;background:var(--pri)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:980px;display:flex;background:var(--card);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;font-weight:700;color:var(--mut)}nav .a{color:var(--pri)}.login{max-width:380px;margin:12vh auto;padding:0 18px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;z-index:9}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.SHL||{},sb=window.supabase&&CFG.key&&CFG.key.indexOf("PASTE")<0?supabase.createClient(CFG.url,CFG.key,{auth:{storageKey:"shl-admin-auth"}}):null;
var CAT={food_supplement:"Food & Supplements",pharmacy:"Pharmacy",document_parcel:"Documents & Parcels"};
var S={ok:false,tab:"orders",flt:"all",toast:"",d:[],f:[],r:[],b:[],ob:[]};
function N(n){return "₦"+Math.round(+n||0).toLocaleString("en-NG")}
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){S.toast=m;R();setTimeout(function(){S.toast="";R()},2000)}
function bn(id){var b=S.b.find(function(x){return x.id===id});return b?b.name:"?"}
function fn(id){var f=S.f.find(function(x){return x.id===id});return f?f.name:"Open pool"}
function rn(id){var r=S.r.find(function(x){return x.id===id});return r?r.name:""}
async function boot(){
 if(!sb)return R();
 var ses=(await sb.auth.getSession()).data.session;if(!ses){S.ok=false;return R()}
 var p=(await sb.from("profiles").select("role").eq("user_id",ses.user.id).maybeSingle()).data;
 if(!p||p.role!=="admin"){await sb.auth.signOut();S.ok=false;R();return toast("This login is not an admin")}
 S.ok=true;await load();R();listen()}
async function load(){
 var q=await Promise.all([sb.from("deliveries").select("*").order("created_at",{ascending:false}).limit(500),sb.from("fleets").select("*").order("name"),sb.from("riders").select("id,name,phone,fleet_id,online,active"),sb.from("businesses").select("id,code,name,active,webhook_url"),sb.from("webhook_outbox").select("id,event,attempts,last_error").is("sent_at",null)]);
 S.d=q[0].data||[];S.f=q[1].data||[];S.r=q[2].data||[];S.b=q[3].data||[];S.ob=q[4].data||[]}
var ch=null;
function listen(){if(ch)return;ch=sb.channel("a").on("postgres_changes",{event:"*",schema:"public",table:"deliveries"},function(){clearTimeout(window._t);window._t=setTimeout(async function(){var ae=document.activeElement;await load();if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))R()},400)}).subscribe();setInterval(async function(){if(S.ok){await load();var ae=document.activeElement;if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))R()}},30000)}
async function login(){if(!sb)return toast("Add your key in config.js");var x=await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value});if(x.error)return toast("Wrong email or password");boot()}
async function rpc(f,a,m){var x=await sb.rpc(f,a);if(x.error)return toast(x.error.message);await load();toast(m)}
function route(id,v){if(v==="")return;rpc("route_delivery",{p_id:id,p_fleet:v==="pool"?null:v},v==="pool"?"Released to open pool":"Routed to "+fn(v))}
function cancel(id){if(confirm("Cancel this delivery?"))rpc("cancel_delivery",{p_id:id},"Cancelled")}
function asg(id,v){if(v)rpc("assign_delivery",{p_id:id,p_rider:v},"Assigned to "+rn(v))}
async function upd(id,patch){var x=await sb.from("fleets").update(patch).eq("id",id);if(x.error)return toast(x.error.message);await load();R()}
function setC(id,v){upd(id,{commission_pct:Math.max(0,Math.min(100,+v||0))})}
function tcat(id,k){var f=S.f.find(function(x){return x.id===id}),a=(f.categories||[]).slice(),i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);upd(id,{categories:a})}
function csv(){var rows=[["ref","order_id","business","category","zone","status","fleet","rider","fee","commission","payout","created","delivered"]].concat(S.d.map(function(d){return[d.ref,d.source_order_id,bn(d.business_id),d.category,d.zone||"",d.status,fn(d.fleet_id),rn(d.rider_id),d.fee,d.commission_amt||0,d.payout_amt||0,d.created_at,d.delivered_at||""]}));
 var t=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="deliveries.csv";a.click()}
function grp(k,v){var m={};S.d.filter(function(d){return d.status==="delivered"}).forEach(function(d){var g=k(d);m[g]=m[g]||{n:0,fee:0,com:0};m[g].n++;m[g].fee+=+d.fee||0;m[g].com+=+d.commission_amt||0});return m}
function tbl(m,lab){var ks=Object.keys(m);return ks.length?'<table><tr><th>'+lab+'</th><th>Delivered</th><th>Fees</th><th>Commission</th></tr>'+ks.map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+m[k].n+'</td><td>'+N(m[k].fee)+'</td><td>'+N(m[k].com)+'</td></tr>'}).join("")+'</table>':'<p class="sub">No delivered orders yet.</p>'}
function R(){var a=document.getElementById("app"),h="",T=S.toast?'<div class="toast">'+esc(S.toast)+'</div>':"";
if(!S.ok){a.innerHTML='<div class="login"><h2>SmartyHub Admin</h2><p class="sub">Staff only.</p><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Sign in</button>'+(sb?"":'<p class="sub" style="margin-top:12px">Not configured: add your key in config.js.</p>')+'</div>'+T;return}
var del=S.d.filter(function(d){return d.status==="delivered"}),can=S.d.filter(function(d){return d.status==="cancelled"}),live=S.d.filter(function(d){return["open","claimed","assigned","picked_up"].indexOf(d.status)>-1});
if(S.tab==="orders"){var F={all:["All",function(){return true}],open:["Open",function(d){return d.status==="open"||d.status==="claimed"}],active:["Active",function(d){return d.status==="assigned"||d.status==="picked_up"}],done:["Delivered",function(d){return d.status==="delivered"}],x:["Cancelled",function(d){return d.status==="cancelled"}]};
 var list=S.d.filter(F[S.flt][1]);
 h='<h2>Orders ('+list.length+')</h2><div class="chips">'+Object.keys(F).map(function(k){return '<button class="chip '+(S.flt===k?"a":"")+'" onclick="S.flt=\''+k+'\';R()">'+F[k][0]+'</button>'}).join("")+'</div><div class="grid">'+(list.length?list.map(function(d){var open=["open","claimed","assigned"].indexOf(d.status)>-1,fr=S.r.filter(function(r){return r.fleet_id===d.fleet_id&&r.active});
 return '<div class="card"><div class="row"><span class="fee">'+N(d.fee)+'</span><span class="st">'+d.status.toUpperCase().replace("_"," ")+'</span></div><div class="sub">'+esc(d.ref)+' · '+esc(bn(d.business_id))+' · '+esc(CAT[d.category]||d.category)+' · '+esc(d.zone||"")+'</div><p style="margin:8px 0">'+esc(d.pickup_name||"")+" "+esc(d.pickup_address)+'<br><span class="sub">to</span> '+esc(d.drop_address)+'</p><div class="sub">'+esc(fn(d.fleet_id))+(d.rider_id?" · "+esc(rn(d.rider_id)):"")+'</div>'+
 (open?'<select onchange="route(\''+d.id+'\',this.value);this.value=\'\'"><option value="">Route to…</option><option value="pool">Open pool</option>'+S.f.map(function(f){return '<option value="'+f.id+'">'+esc(f.name)+'</option>'}).join("")+'</select>'+(fr.length?'<select onchange="asg(\''+d.id+'\',this.value)"><option value="">Assign rider…</option>'+fr.map(function(r){return '<option value="'+r.id+'">'+esc(r.name)+(r.online?"":" (offline)")+'</option>'}).join("")+'</select>':"")+'<button class="btn s" onclick="cancel(\''+d.id+'\')">Cancel delivery</button>':"")+'</div>'}).join(""):'<p class="sub">No orders yet. They appear here the moment a vendor accepts one.</p>')+'</div>'}
if(S.tab==="fleets")h='<h2>Fleets & riders</h2><div class="grid">'+S.f.map(function(f){var rs=S.r.filter(function(r){return r.fleet_id===f.id});return '<div class="card"><b>'+esc(f.name)+'</b><div class="sub">'+rs.length+' riders · '+rs.filter(function(r){return r.online}).length+' online</div><div class="chips">'+Object.keys(CAT).map(function(k){return '<button class="chip '+((f.categories||[]).indexOf(k)>-1?"a":"")+'" onclick="tcat(\''+f.id+"','"+k+'\')">'+CAT[k]+'</button>'}).join("")+'</div><label class="sub">Commission %</label><input type="number" value="'+f.commission_pct+'" onchange="setC(\''+f.id+'\',this.value)"><button class="btn s" onclick="upd(\''+f.id+'\',{active:'+!f.active+'})">'+(f.active?"Suspend fleet":"Reactivate fleet")+'</button></div>'}).join("")+'</div><h3>Businesses</h3>'+S.b.map(function(b){return '<div class="card row" style="margin-bottom:8px"><span>'+esc(b.name)+'</span><span class="sub">'+(b.active?"Active":"Off")+(b.webhook_url?" · webhook set":" · no webhook")+'</span></div>'}).join("")+(S.ob.length?'<h3>Status messages not delivered ('+S.ob.length+')</h3>'+S.ob.slice(0,10).map(function(o){return '<p class="sub">'+esc(o.event)+' · tries '+o.attempts+' · '+esc(o.last_error||"waiting")+'</p>'}).join(""):"");
if(S.tab==="reports"){var gross=del.reduce(function(s,d){return s+(+d.fee||0)},0),com=del.reduce(function(s,d){return s+(+d.commission_amt||0)},0),mins=del.filter(function(d){return d.delivered_at}).map(function(d){return(new Date(d.delivered_at)-new Date(d.created_at))/60000}),avg=mins.length?Math.round(mins.reduce(function(a,b){return a+b},0)/mins.length):0;
 var days=[];for(var i=6;i>=0;i--){var t=new Date();t.setDate(t.getDate()-i);var k=t.toISOString().slice(0,10);days.push([k.slice(5),S.d.filter(function(d){return String(d.created_at).slice(0,10)===k}).length])}var mx=Math.max.apply(null,days.map(function(x){return x[1]}).concat([1]));
 h='<div class="row"><h2>Reports</h2><button class="pill" onclick="csv()">Export CSV</button></div><div class="kpi"><div class="card"><span class="sub">Live now</span><b>'+live.length+'</b></div><div class="card"><span class="sub">Delivered</span><b>'+del.length+'</b></div><div class="card"><span class="sub">Cancelled</span><b>'+can.length+'</b></div><div class="card"><span class="sub">Gross fees</span><b>'+N(gross)+'</b></div><div class="card"><span class="sub">Commission</span><b>'+N(com)+'</b></div><div class="card"><span class="sub">Avg minutes to deliver</span><b>'+avg+'</b></div></div><h3>Orders, last 7 days</h3><div class="card">'+days.map(function(x){return '<div class="row" style="margin:6px 0"><span class="sub" style="width:50px">'+x[0]+'</span><div style="flex:1"><div class="bar" style="width:'+Math.max(2,x[1]/mx*100)+'%"></div></div><b>'+x[1]+'</b></div>'}).join("")+'</div><h3>By business</h3><div class="card">'+tbl(grp(function(d){return bn(d.business_id)}),"Business")+'</div><h3>By fleet</h3><div class="card">'+tbl(grp(function(d){return fn(d.fleet_id)}),"Fleet")+'</div>'}
a.innerHTML='<header>SmartyHub Admin<button onclick="sb.auth.signOut().then(function(){S.ok=false;R()})">Sign out</button></header><div class="w">'+h+'</div><nav>'+[["orders","Orders"],["fleets","Fleets"],["reports","Reports"]].map(function(t){return '<button class="'+(S.tab===t[0]?"a":"")+'" onclick="S.tab=\''+t[0]+'\';R()">'+t[1]+'</button>'}).join("")+'</nav>'+T}
boot();
</script></body></html>
